name: Verify and publish Cap Stack Sort
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:yandex
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - run: ./gradlew --no-daemon assembleDebug bundleRelease
        working-directory: mobile/android
      - run: |
          mkdir -p dist/downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/downloads/cap-stack-sort-android-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified production files
        id: deployment
        uses: actions/deploy-pages@v4
