<!doctype html>
<html lang="en"><head>

<style>
:root{--ink:#29231d;--cream:#ead7bd;--dark:#292c2d;--gold:#ffc62f}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);overflow-x:hidden;background:radial-gradient(circle at 52% 12%,#f2d2a4 0,#d9ac79 38%,#bd8c5b 100%);padding:18px}.scene{width:min(1420px,98vw);margin:auto;display:grid;grid-template-columns:minmax(190px,1fr) minmax(520px,700px) minmax(190px,1fr);gap:24px;align-items:center}.side{min-height:760px;position:relative}.logo{font-weight:1000;font-size:clamp(42px,4.5vw,72px);line-height:.78;letter-spacing:-.06em;color:#fff;text-shadow:0 5px 0 #173d61,0 8px 12px #0005;transform:rotate(-5deg);margin-top:42px}.logo b{display:block;color:#ffc72f}.logo small{display:inline-block;font-size:.35em;letter-spacing:.06em;background:#e7edf1;color:#173d61;padding:6px 13px;border:4px solid #173d61;border-radius:7px;margin-left:28px}.tagline{font-weight:900;font-size:14px;margin:25px 0}.scribble{font:italic 36px Georgia,serif;color:#9c7049;transform:rotate(-4deg);margin:80px 0 0 20px}.decor-cap{width:78px;height:78px;border-radius:50%;background:#17191a;display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 7px 9px #0005;border:7px ridge #252525;margin:55px auto 0}.decor-cap span{font-size:13px;text-align:center}.note{width:150px;background:#ead6a9;padding:24px 14px;font:italic 25px Georgia,serif;text-align:center;transform:rotate(8deg);box-shadow:0 8px 16px #0002;margin:70px auto}.coaster{width:170px;height:170px;border-radius:50%;background:#c78e4e;display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;transform:rotate(-8deg);margin:120px auto 0;box-shadow:0 6px 15px #0002}.game{width:100%;position:relative}.topbar{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{height:76px;background:linear-gradient(#373a3b,#292b2c);border:2px solid #666;border-radius:10px;color:#fff;text-align:center;padding:8px;box-shadow:0 4px 9px #0003}.stat span{display:block;font-size:12px;font-weight:900;letter-spacing:.12em;color:#d8d5d0}.stat b{display:block;font-size:27px;line-height:1.2}.score b{color:#ffd12e}.tools{position:fixed;right:24px;top:22px;z-index:10}.icon{width:54px;height:54px;border-radius:12px;border:2px solid #aaa;background:#303234;color:white;font-size:28px;cursor:pointer}.board-wrap{padding:13px;border-radius:30px;background:linear-gradient(145deg,#ecd9bd,#d9bea0);border:4px solid #d8b994;box-shadow:0 12px 15px #65401f4d,inset 0 2px #fff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{position:relative;height:92px;border:2px solid #d0b89a;border-radius:13px;background:linear-gradient(145deg,#e4ceb0,#f2dfc5);box-shadow:inset 0 2px 5px #b99d7a66,0 1px #fff;cursor:pointer;overflow:visible}.cell.empty:hover,.cell.target{outline:3px solid #f3b63d;outline-offset:1px}.cell.bad{animation:shake .35s}.stack{position:absolute;inset:0;pointer-events:none}.cap{position:absolute;width:68px;height:68px;left:calc(50% - 34px);border-radius:50%;background-image:url('https://raw.githubusercontent.com/ars023ai/chip-sort-game-v.1.1/facaded6d58d6ad0c607b825c594185976a01664/assets/cap-sprite-v08.webp');background-size:500% 400%;background-repeat:no-repeat;filter:drop-shadow(0 5px 3px #0005)}.cap.flying,.cap.v07-fly{position:fixed;z-index:40;pointer-events:none}.charged{box-shadow:0 0 0 3px #ffc72f,0 0 22px #ffc72f}.pulse9{animation:pulse 1s infinite}.pulse8{box-shadow:0 0 0 2px #9fcb96}.tray-label{text-align:right;font-size:11px;font-weight:900;letter-spacing:.15em;margin:10px 8px 4px}.tray{height:102px;background:linear-gradient(#343839,#202324);border:7px solid #d9c3a8;border-radius:20px;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;box-shadow:0 6px 10px #0004}.tray-slot{position:relative;overflow:visible;border:1px solid #464a4c;border-radius:10px;background:transparent;cursor:grab}.tray-slot.selected{outline:3px solid #ffc72f}.ghost{position:fixed;z-index:50;width:76px;height:76px;pointer-events:none;transform:translate(-50%,-50%)}.ghost .stack{position:relative;height:100%}.banner{position:fixed;top:20px;left:50%;transform:translate(-50%,-140%);z-index:60;background:#282a2c;color:#fff;padding:10px 20px;border-radius:12px;text-align:center;transition:transform .28s;box-shadow:0 7px 20px #0004}.banner.show{transform:translate(-50%,0)}.banner b{display:block;font-size:11px;letter-spacing:.16em}.banner span{font-weight:900;color:#f2bd56}.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#1a1714aa;padding:20px}.overlay[hidden]{display:none}.modal{width:min(360px,100%);background:#fff4e1;border-radius:22px;padding:22px;text-align:center;box-shadow:0 16px 40px #0007}.modal h2{margin:0 0 10px}.result{padding:12px;border-radius:14px;background:#292b2d;color:#fff}.result b{display:block;font-size:38px}.modal button{border:0;border-radius:11px;padding:11px 16px;margin:7px 3px;font-weight:900;cursor:pointer;background:#e6a74f}.score-hit{animation:score .17s 2}@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}@keyframes pulse{50%{box-shadow:0 0 0 3px #e6a74f}}@keyframes score{50%{transform:scale(1.09)}}@media(max-width:1050px){.scene{grid-template-columns:1fr}.side{display:none}.game{max-width:700px;margin:auto}}@media(max-width:620px){body{padding:8px}.topbar{gap:4px}.stat{height:62px;padding:5px}.stat b{font-size:20px}.stat span{font-size:9px}.cell{height:72px}.cap{width:56px;height:56px;left:calc(50% - 28px)}.tools{right:8px;top:8px}.icon{width:42px;height:42px}.tray{height:88px}}
</style></head><body>
<div class="tools"><button class="icon" id="settings" aria-label="Settings">⚙</button></div>
<div class="scene"><aside class="side"><div class="logo">CAP<b>STACK</b><small>SORT</small></div><div class="tagline">SAME CAPS. BIGGER COMBOS.</div><div class="scribble">Good Drinks.<br>Better Combos! :)</div><div class="decor-cap"><span>GOOD<br>VIBES</span></div></aside>
<main class="game"><header class="topbar"><div class="stat score" id="score-card"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>BEST</span><b id="best">0</b></div><div class="stat"><span>COMBO</span><b id="combo">—</b></div><div class="stat"><span>TIME</span><b id="time">0:00</b></div></header><section class="board-wrap"><div class="grid" id="grid" aria-label="5 by 6 game board"></div></section><div class="tray-label">NEXT STACKS · DRAG OR TAP</div><section class="tray" id="tray"></section></main>
<aside class="side"><div class="note">Small Moves.<br>Big Combos!<br>♛</div><div class="coaster">PLAY<br>RELAX<br>REPEAT ☺</div></aside></div>
<div class="banner" id="banner"><b id="banner-title"></b><span id="banner-text"></span></div><div class="overlay" id="overlay" hidden><section class="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><button id="replay">New game</button><button id="sound-toggle">Sound: On</button><button id="close-modal">Close</button></section></div>
