<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d2aa79">
<meta name="description" content="Cap Stack Sort V2 clean playtest">
<title>Cap Stack Sort — V2 Playtest</title>
<style>
:root{--cap:66px;--cell-h:82px;--gap:7px;--ink:#382b1f;--sprite:url('https://raw.githubusercontent.com/ars023ai/chip-sort-game-v.1.1/main/assets/cap-sprite-v08.webp')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;background:
radial-gradient(circle at 50% 34%,#f3d7ad77,transparent 45%),
repeating-linear-gradient(1deg,#0000 0 74px,#80582d22 75px 77px,#fff6de1e 78px 80px),
linear-gradient(115deg,#b88a58,#efd0a4 36%,#ddb180 66%,#b78351)}
body:before,body:after{content:'';position:fixed;width:250px;height:190px;pointer-events:none;z-index:0;opacity:.8;filter:drop-shadow(0 12px 16px #0003);background:radial-gradient(ellipse at 25% 50%,#385a20 0 29%,transparent 30%),radial-gradient(ellipse at 62% 36%,#52752e 0 28%,transparent 29%),radial-gradient(ellipse at 75% 70%,#233f16 0 28%,transparent 29%)}body:before{left:-90px;top:-65px;transform:rotate(-25deg)}body:after{right:-100px;bottom:-75px;transform:rotate(155deg)}button{font:inherit}.scene{position:relative;z-index:2;width:min(1390px,97vw);display:grid;grid-template-columns:minmax(185px,1fr) minmax(520px,650px) minmax(185px,1fr);gap:24px;align-items:center}.side{align-self:stretch;position:relative;display:flex;flex-direction:column;justify-content:center;gap:24px;min-width:0}.brand-block{transform:rotate(-6deg);margin-left:8px}.logo{font-weight:1000;line-height:.8;letter-spacing:-.08em;font-size:clamp(40px,4.6vw,76px);color:#fff;text-shadow:0 3px 0 #194b78,0 6px 0 #0d3557,0 11px 18px #3d271866}.logo b{display:block;color:#ffd03f}.logo small{display:block;width:max-content;margin:.22em 0 0 1.22em;padding:.18em .35em;border:3px solid #294c66;border-radius:9px;background:#dce2e4;color:#263e51;font-size:.33em;letter-spacing:.03em;text-shadow:none}.tag{margin:14px 0 0 7px;font-size:13px;letter-spacing:.07em;font-weight:950;color:#4c3b2b}.scribble{font:italic clamp(23px,2.6vw,40px)/1.14 Georgia,serif;color:#9a744a;transform:rotate(-7deg);text-align:center;opacity:.82}.goodvibes{width:92px;height:92px;border-radius:50%;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#555,#171717 56%,#050505);border:8px ridge #111;color:#eee;box-shadow:0 10px 15px #5136224a,inset 0 2px 4px #fff4;font-weight:950;text-align:center;line-height:1.05}.opener{position:absolute;left:8%;bottom:5%;width:80px;height:166px;border-radius:20px;background:linear-gradient(145deg,#e6e3dc,#91979a);border:2px solid #73787b;box-shadow:0 11px 16px #51372244;transform:rotate(-12deg);display:grid;place-items:center;text-align:center;font-weight:950;line-height:1.25;color:#616567}.loose-cola{position:absolute;left:-1%;bottom:-3%;width:88px;height:88px;border-radius:50%;background-image:var(--sprite);background-size:500% 400%;background-position:0 0;filter:drop-shadow(0 7px 7px #44261666);transform:rotate(-9deg)}.note{align-self:center;max-width:230px;background:linear-gradient(135deg,#f4e2bf,#d8bb88);padding:22px 25px;box-shadow:0 12px 18px #60422833;transform:rotate(8deg);font:italic 24px/1.32 Georgia,serif;color:#78644b;text-align:center}.arscap{width:92px;height:92px;border-radius:50%;margin:3px auto;background-image:var(--sprite);background-size:500% 400%;background-position:25% 100%;filter:drop-shadow(0 10px 10px #3d2b224d)}.coaster{width:174px;height:174px;border-radius:50%;margin:auto;background:radial-gradient(#d9b27f,#b68149);border:2px solid #ac7b49;box-shadow:0 9px 15px #5b3b273a;display:grid;place-items:center;text-align:center;font-size:24px;line-height:1.27;font-weight:950;color:#704a28;transform:rotate(-9deg)}.glass{position:absolute;right:1%;bottom:4%;width:92px;height:145px;border-radius:12px 12px 30px 30px;background:linear-gradient(90deg,#ffffff4a,#ffffff10 30%,#fff6 72%,#ffffff20),linear-gradient(#0000 0 34%,#c77b2b95 35% 100%);border:2px solid #ffffff7d;box-shadow:0 12px 16px #5334213d;transform:rotate(5deg)}.game-shell{width:100%;max-width:650px;margin:auto;position:relative}.hud{display:grid;grid-template-columns:1.1fr .88fr .8fr .98fr;gap:8px;margin-bottom:10px}.hud-card{height:74px;border-radius:11px;background:linear-gradient(145deg,#484d4e,#292d2e);border:1px solid #999892;box-shadow:0 6px 10px #52382330,inset 0 1px #ffffff35;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.hud-card span{font-size:11px;letter-spacing:.13em;color:#d8d5ce;font-weight:900}.hud-card b{font-size:26px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}.hud-card.score b{font-size:32px;color:#ffe04f}.hud-card.combo b{color:#ff951f}.score-hit{animation:scoreHit .17s cubic-bezier(.2,.8,.2,1)}.board{position:relative;padding:15px 13px 13px;border-radius:28px;background:linear-gradient(145deg,#f1dfc6,#d7c2a5 58%,#efe1ca);border:2px solid #f9ecdc;box-shadow:0 16px 26px #5a3d2848,inset 0 0 0 2px #b89d7c,inset 0 0 0 8px #e7d4ba}.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,var(--cell-h));gap:var(--gap);position:relative;z-index:2}.cell{appearance:none;position:relative;border-radius:13px;background:linear-gradient(145deg,#dccbb3,#eadbc5);border:1px solid #eadbc7;box-shadow:inset 0 1px 3px #8b74532d,0 1px 0 #fff9;overflow:visible;transition:.14s border-color,.14s box-shadow,.14s transform;min-width:0;padding:0}.cell.target{border-color:#daa64c;box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #f9ca70bb,0 0 20px #ffc75d66}.cell.bad{animation:bad .32s ease}.cell.pulse8{box-shadow:inset 0 1px 3px #8d765438,0 0 0 1px #f0bd596f,0 0 14px #eec46d55}.cell.pulse9{box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #f4c45b9c,0 0 24px #ffd46d8a;animation:near .9s ease-in-out infinite}.cell.charged{box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #ffe2a6d9,0 0 29px #ffc95d92;animation:charge .34s ease-in-out infinite alternate}.stack{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:var(--cap);height:calc(var(--cap) + 46px);pointer-events:none}.cap{position:absolute;width:var(--cap);height:var(--cap);border-radius:50%;background-image:var(--sprite);background-size:500% 400%;background-repeat:no-repeat;filter:drop-shadow(0 3px 2px #2c1b1059);pointer-events:none}.tray-wrap{margin:10px auto 0;width:96%;display:grid;grid-template-columns:1fr 118px}.tray{height:110px;background:linear-gradient(#3d4142,#202425);border:7px solid #c9bba6;border-radius:20px 0 0 20px;box-shadow:0 8px 13px #5b3a2442,inset 0 0 0 2px #f4ebdc;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 10px}.tray-slot{appearance:none;position:relative;border:0;border-right:1px solid #ffffff14;background:transparent;border-radius:11px;cursor:grab;padding:0}.tray-slot:last-child{border-right:0}.tray-slot.selected{background:#ffc55d16;outline:1px solid #e4b367}.tray-slot:active{cursor:grabbing}.tray-slot .stack{bottom:4px}.tray-label{display:grid;place-items:center;background:#d7c3a6;border:1px solid #c4a884;border-radius:0 16px 16px 0;color:#4d3b2c;font-weight:1000;font-size:14px;letter-spacing:.04em;line-height:1.2;text-align:center}.tray-label small{font-size:10px;letter-spacing:.04em;margin-top:7px}.settings{position:fixed;right:24px;top:22px;z-index:50;width:52px;height:52px;border-radius:12px;border:1px solid #a4a29d;background:linear-gradient(#505455,#2e3233);box-shadow:0 5px 12px #3a291e55;color:#ecece9;font-size:28px;cursor:pointer}.banner{position:fixed;left:50%;top:12%;z-index:80;transform:translate(-50%,-18px) scale(.94);opacity:0;pointer-events:none;background:linear-gradient(145deg,#40342a,#1f1c19);border:1px solid #c79344;color:#fff2d0;border-radius:18px;padding:12px 22px;box-shadow:0 14px 45px #0006;text-align:center;transition:.23s}.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}.banner small{display:block;color:#f8c75d;font-weight:950;letter-spacing:.18em}.banner b{display:block;font-size:19px;margin-top:4px}.overlay{position:fixed;inset:0;z-index:100;background:#211a16c9;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none}.modal{width:min(420px,92vw);background:linear-gradient(145deg,#3b3028,#201c19);border:1px solid #786047;color:#f7ead8;border-radius:22px;padding:24px;box-shadow:0 24px 70px #0007}.modal h2{margin:2px 0 8px;font-size:31px}.modal p{color:#cdbda9;line-height:1.5}.result{background:#161412;border-radius:15px;padding:16px;text-align:center;margin:14px 0}.result span,.result small{display:block;color:#c7b7a3;font-size:11px;letter-spacing:.1em}.result b{display:block;font-size:44px;color:#ffd767}.modal-actions{display:grid;gap:8px}.modal button{width:100%;padding:11px;border-radius:12px;font-weight:900}.primary{border:0;background:linear-gradient(#ffd783,#eaaa4f);color:#342416}.secondary{border:1px solid #6d5846;background:transparent;color:#ead9c4}.ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 10px 8px #0004);opacity:.97}.ghost .stack{position:relative;left:auto;bottom:auto;transform:none}.flying,.v07-fly{position:fixed;z-index:130;pointer-events:none;margin:0;will-change:transform,opacity}.build-badge{position:fixed;left:12px;bottom:10px;z-index:4;font-size:10px;font-weight:800;letter-spacing:.08em;color:#5d432d99}
@keyframes bad{50%{transform:translateX(4px);border-color:#d95d4d}75%{transform:translateX(-3px)}}@keyframes near{50%{transform:translateY(-1px)}}@keyframes charge{from{transform:translateY(0)}to{transform:translateY(-1px)}}@keyframes scoreHit{0%{transform:scale(1)}42%{transform:scale(1.065)}100%{transform:scale(1)}}
@media(max-width:900px){:root{--cap:54px;--cell-h:65px;--gap:5px}body{padding:0}.scene{display:block;width:min(100vw,570px)}.side{display:none}.game-shell{max-width:none;padding:5px}.hud{gap:5px;margin-top:3px}.hud-card{height:58px}.hud-card span{font-size:9px}.hud-card b{font-size:19px}.hud-card.score b{font-size:25px}.board{padding:10px 9px 9px;border-radius:21px}.tray{height:91px}.tray-wrap{grid-template-columns:1fr 98px}.settings{top:8px;right:8px;width:42px;height:42px;font-size:23px}.build-badge{display:none}}
@media(max-width:500px){:root{--cap:47px;--cell-h:57px;--gap:4px}.hud-card b{font-size:16px}.hud-card.score b{font-size:22px}.tray{height:82px}.tray-wrap{grid-template-columns:1fr 88px}.tray-label{font-size:11px}.tray-label small{font-size:8px}}
</style>
</head>
<body>
<div class="scene">
  <aside class="side">
    <div class="brand-block"><div class="logo">CAP<b>STACK</b><small>SORT</small></div><div class="tag">SAME CAPS. BIGGER COMBOS.</div></div>
    <div class="scribble">Good Drinks<br>Better Combos!!</div>
    <div class="goodvibes">GOOD<br>VIBES</div>
    <div class="opener">OPEN<br>MORE<br>FUN</div><div class="loose-cola" aria-hidden="true"></div>
  </aside>

  <main class="game-shell">
    <section class="hud" aria-label="Game status">
      <div class="hud-card score" id="score-card"><span>SCORE</span><b id="score">0</b></div>
      <div class="hud-card"><span>BEST</span><b id="best">0</b></div>
      <div class="hud-card combo"><span>COMBO</span><b id="combo">—</b></div>
      <div class="hud-card"><span>TIME</span><b id="time">0:00</b></div>
    </section>
    <section class="board"><div class="grid" id="grid" aria-label="5 by 6 cap board"></div></section>
    <section class="tray-wrap"><div class="tray" id="tray" aria-label="Next stacks"></div><div class="tray-label">NEXT STACKS →<small>DRAG OR TAP</small></div></section>
  </main>

  <aside class="side">
    <div class="note">Small Moves<br>Big Combos!<br>♛</div>
    <div class="arscap" title="ArsCorp decorative cap"></div>
    <div class="coaster">PLAY<br>RELAX<br>REPEAT</div>
    <div class="glass" aria-hidden="true"></div>
  </aside>
</div>
<button class="settings" id="settings" aria-label="Settings">⚙</button>
<div class="banner" id="banner"><small id="banner-title">NEW CAP UNLOCKED</small><b id="banner-text"></b></div>
<div class="overlay" id="overlay" hidden>
  <div class="modal"><h2 id="modal-title">Settings</h2><div id="modal-body"><p>Current playtest settings.</p></div><div class="modal-actions"><button class="secondary" id="sound-toggle">Sound: On</button><button class="primary" id="replay">Replay</button><button class="secondary" id="close-modal">Close</button></div></div>
</div>
<div class="build-badge">V2 CLEAN PLAYTEST · 2026-09-21</div>
<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
