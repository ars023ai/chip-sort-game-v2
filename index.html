<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d3a573">
  <meta name="description" content="One small move. A whole cascade. Stack matching bottle caps, chase your best score, and discover 16 brands.">
  <meta property="og:title" content="Cap Stack Sort">
  <meta property="og:description" content="Same caps. Bigger chains. A relaxed start and a score worth chasing.">
  <meta property="og:image" content="assets/reference-approved-b-v4.webp">
  <title>Cap Stack Sort</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/master-caps.webp" as="image">
  <link rel="stylesheet" href="styles.css?v=2.0.2">
</head>
<body>
  <div class="play-area" id="play-area">
    <div class="scene" id="scene">
      <h1 class="sr-only">Cap Stack Sort</h1>
      <main class="game-shell" aria-label="Cap Stack Sort game">
        <header class="hud" aria-label="Scoreboard">
          <div class="hud-card"><span id="best-label">BEST</span><b id="best">0</b></div>
          <div class="hud-card score" id="score-card"><span>SCORE</span><b id="score">0</b></div>
          <div class="hud-card time-card"><span>TIME</span><b id="time">0:00</b><i aria-hidden="true"></i></div>
        </header>
        <section class="board" aria-label="Bottle cap board">
          <div class="grid" id="grid" aria-label="5 by 6 game board"></div>
        </section>
        <section class="tray-wrap" aria-label="Next stacks">
          <div class="tray" id="tray"></div>
          <div class="tray-label sr-only">Next stacks. Drag or tap.</div>
        </section>
        <p class="hint" id="hint">Pick a stack. Tap an empty cell.</p>
        <div class="chain-flash" id="chain-flash" aria-hidden="true"></div>
      </main>
      <button class="settings" id="settings" aria-label="Pause and settings" title="Pause and settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3h4.8l.7 2.6 2.3 1.3 2.6-.7 2.4 4.2-1.9 1.9v2.5l1.9 1.9-2.4 4.2-2.6-.7-2.3 1.3-.7 2.6H9.6l-.7-2.6-2.3-1.3-2.6.7-2.4-4.2 1.9-1.9v-2.5l-1.9-1.9L4 6.2l2.6.7 2.3-1.3L9.6 3Z" transform="translate(1 -1) scale(.9)"/><circle cx="12" cy="12" r="3.5"/></svg>
      </button>
    </div>
  </div>
  <aside id="studio" class="studio" aria-label="Creator Studio" hidden></aside>
  <button class="capture-exit" id="capture-exit" hidden>Exit capture · Esc</button>
  <div class="banner" id="banner" role="status"><small id="banner-title"></small><b id="banner-text"></b></div>
  <div class="overlay" id="overlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <button class="modal-x" id="close-modal" aria-label="Close dialog">×</button>
      <div class="eyebrow" id="modal-eyebrow">TAKE A BREATHER</div>
      <h2 id="modal-title">Paused</h2>
      <div id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>
  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <script src="rules.js?v=2.0.2"></script>
  <script src="balance.js?v=2.0.2"></script>
  <script src="scenes.js?v=2.0.2"></script>
  <script src="session.js?v=2.0.2"></script>
  <script src="sound.js?v=2.0.2"></script>
  <script src="game.js?v=2.0.2"></script>
  <script src="studio.js?v=2.0.2"></script>
</body>
</html>
