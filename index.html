<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c99b68">
<meta name="description" content="Cap Stack Sort V2 reference design playtest">
<title>Cap Stack Sort — Reference Design Pass</title>
<style>
:root{
  --cap:88px;
  --cell-h:106px;
  --gap:8px;
  --ink:#34271d;
  --cream:#ead5b7;
  --dark:#2b2f30;
  --gold:#ffc632;
  --sprite:url('assets/master-caps.webp?v=20260922c');
  --arscap:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
  min-height:100svh;
  overflow-x:hidden;
  padding:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:var(--ink);
  user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(circle at 55% 13%,rgba(255,244,220,.72) 0 10%,rgba(255,244,220,0) 28%),
    repeating-linear-gradient(0deg,rgba(255,255,255,0) 0 84px,rgba(108,72,35,.11) 85px 87px,rgba(255,255,255,.07) 88px 90px),
    linear-gradient(105deg,#b77d47 0%,#e9bd83 34%,#d9a36c 67%,#ad7040 100%);
}
body:before,body:after{
  content:"";position:fixed;z-index:0;pointer-events:none;
  width:330px;height:280px;opacity:.96;
  filter:drop-shadow(0 18px 18px rgba(41,28,17,.24));
  background:
    radial-gradient(ellipse at 22% 46%,#2f541d 0 26%,transparent 27%),
    radial-gradient(ellipse at 59% 32%,#4f7b2c 0 27%,transparent 28%),
    radial-gradient(ellipse at 76% 71%,#234316 0 26%,transparent 27%);
}
body:before{left:-105px;top:-105px;transform:rotate(-22deg)}
body:after{right:-110px;bottom:-125px;transform:rotate(154deg)}
button{font:inherit}
.scene{
  position:relative;z-index:2;
  width:min(1536px,100vw);
  min-height:100svh;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(260px,1fr) minmax(680px,760px) minmax(260px,1fr);
  gap:20px;
  align-items:center;
  padding:18px 26px 18px;
}
.side{position:relative;align-self:stretch;min-height:940px;min-width:0}
.brand-block{position:absolute;left:8px;top:45px;transform:rotate(-5.5deg)}
.logo{
  font-weight:1000;line-height:.76;letter-spacing:-.075em;
  font-size:clamp(58px,5.25vw,94px);color:#fff;
  text-shadow:0 4px 0 #1d527f,0 8px 0 #0d3453,0 15px 24px rgba(61,39,25,.42)
}
.logo b{display:block;color:#ffc82e}
.logo small{
  display:block;width:max-content;margin:.23em 0 0 1.18em;padding:.12em .36em;
  border:4px solid #315875;border-radius:10px;background:#e3e8e9;color:#243d52;
  font-size:.32em;letter-spacing:.04em;text-shadow:none;transform:rotate(1deg)
}
.tag{margin:18px 0 0 8px;font-size:14px;letter-spacing:.075em;font-weight:1000;color:#3f3328}
.scribble{
  position:absolute;left:20px;top:315px;width:270px;
  font:italic clamp(30px,2.8vw,48px)/1.12 Georgia,serif;
  color:#9b6d44;transform:rotate(-6deg);text-align:center;opacity:.84
}
.goodvibes{
  position:absolute;left:56px;bottom:220px;width:100px;height:100px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,#5d5d5d,#171717 57%,#050505);
  border:8px ridge #111;color:#eee;box-shadow:0 12px 17px rgba(81,54,34,.31),inset 0 2px 4px #fff4;
  font-weight:1000;text-align:center;line-height:1.04;transform:rotate(-4deg)
}
.opener{
  position:absolute;left:18px;bottom:20px;width:92px;height:205px;border-radius:24px;
  background:linear-gradient(145deg,#ece8df,#9ca1a4);border:2px solid #747a7d;
  box-shadow:0 13px 20px rgba(81,55,34,.28);transform:rotate(-13deg);
  display:grid;place-items:center;text-align:center;font-weight:1000;line-height:1.25;color:#626668
}
.opener:before{
  content:"";position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:56px;height:36px;border:9px solid #888d90;border-bottom-width:12px;border-radius:18px 18px 12px 12px;
  background:rgba(255,255,255,.16)
}
.loose-cola{
  position:absolute;left:-10px;bottom:-6px;width:102px;height:102px;border-radius:50%;
  background-image:var(--sprite);background-size:500% 400%;background-position:0% 0%;
  filter:drop-shadow(0 9px 9px rgba(68,38,22,.42));transform:rotate(-9deg)
}
.note{
  position:absolute;right:52px;top:92px;width:190px;
  background:linear-gradient(135deg,#f4e3c3,#d9bc8b);padding:24px 22px;
  box-shadow:0 13px 20px rgba(96,66,40,.22);transform:rotate(8deg);
  font:italic 28px/1.3 Georgia,serif;color:#726049;text-align:center
}
.arscap{
  position:absolute;left:74px;top:365px;width:112px;height:112px;border-radius:50%;
  background-image:var(--arscap);background-size:cover;background-position:center;background-repeat:no-repeat;
  filter:drop-shadow(0 12px 12px rgba(61,43,34,.34))
}
.coaster{
  position:absolute;right:18px;bottom:72px;width:215px;height:215px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#dcb680,#b67d43 72%);border:2px solid #aa7540;
  box-shadow:0 11px 18px rgba(91,59,39,.25);display:grid;place-items:center;text-align:center;
  font-size:26px;line-height:1.27;font-weight:1000;color:#714a28;transform:rotate(-8deg)
}
.glass{
  position:absolute;right:-12px;top:390px;width:112px;height:250px;border-radius:18px 18px 36px 36px;
  background:
    linear-gradient(90deg,#ffffff52,#ffffff0d 27%,#fff7 72%,#ffffff1a),
    linear-gradient(#0000 0 27%,#8a4e16aa 28% 100%);
  border:2px solid #ffffff91;box-shadow:0 14px 18px rgba(83,52,33,.28);transform:rotate(6deg)
}
.glass:after{content:"";position:absolute;left:14px;right:14px;top:64px;height:9px;border-radius:50%;background:rgba(255,245,224,.45)}
.game-shell{width:100%;max-width:760px;margin:auto;position:relative;padding-top:0}
.hud{display:grid;grid-template-columns:1.14fr .9fr .82fr .95fr;gap:8px;margin-bottom:12px;padding:0 4px}
.hud-card{
  height:78px;border-radius:11px;background:linear-gradient(145deg,#474c4d,#292d2e);
  border:1px solid #90918d;box-shadow:0 7px 12px rgba(82,56,35,.22),inset 0 1px #ffffff35;
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center
}
.hud-card span{font-size:11px;letter-spacing:.13em;color:#d8d5ce;font-weight:950}
.hud-card b{font-size:26px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.hud-card.score b{font-size:36px;color:#ffe044}.hud-card.combo b{color:#ff951f}
.score-hit{animation:scoreHit .17s cubic-bezier(.2,.8,.2,1)}
.board{
  position:relative;padding:16px 14px 15px;border-radius:31px;
  background:linear-gradient(145deg,#f1dec2 0%,#dec4a2 48%,#f0dfc6 100%);
  border:2px solid #f8ebd8;
  box-shadow:
    0 18px 0 rgba(118,77,42,.24),
    0 24px 34px rgba(71,42,22,.25),
    inset 0 0 0 2px #b99c79,
    inset 0 0 0 9px #e7d2b5,
    inset 0 2px 0 rgba(255,255,255,.7)
}
.board:before{
  content:"";position:absolute;inset:8px;border-radius:24px;border:1px solid rgba(134,101,66,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);pointer-events:none
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,var(--cell-h));gap:var(--gap);position:relative;z-index:2}
.cell{
  appearance:none;position:relative;min-width:0;padding:0;border-radius:14px;
  background:linear-gradient(145deg,#ddc9aa 0%,#ead9bf 66%,#f1dfc8 100%);
  border:1px solid #ead9c4;
  box-shadow:inset 0 2px 4px rgba(108,82,54,.16),0 1px 0 rgba(255,255,255,.72);
  overflow:visible;transition:.14s border-color,.14s box-shadow,.14s transform
}
.cell:after{content:"";position:absolute;inset:6px;border-radius:10px;border:1px solid rgba(121,91,57,.08);pointer-events:none}
.cell.target{border-color:#daa64c;box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #f9ca70bb,0 0 20px #ffc75d66}
.cell.bad{animation:bad .32s ease}
.cell.pulse8{box-shadow:inset 0 1px 3px #8d765438,0 0 0 1px #f0bd596f,0 0 14px #eec46d55}
.cell.pulse9{box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #f4c45b9c,0 0 24px #ffd46d8a;animation:near .9s ease-in-out infinite}
.cell.charged{box-shadow:inset 0 1px 3px #8d765438,0 0 0 2px #ffe2a6d9,0 0 29px #ffc95d92;animation:charge .34s ease-in-out infinite alternate}
.stack{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:var(--cap);height:calc(var(--cap) + 58px);pointer-events:none}
.cap{
  position:absolute;width:var(--cap);height:var(--cap);left:50%;margin-left:calc(var(--cap) / -2);
  border-radius:50%;background-image:var(--sprite);background-size:500% 400%;background-repeat:no-repeat;
  filter:drop-shadow(0 5px 3px rgba(44,27,16,.38));pointer-events:none;will-change:transform
}
.tray-wrap{margin:12px auto 0;width:97%;display:grid;grid-template-columns:1fr 132px;filter:drop-shadow(0 9px 10px rgba(77,48,29,.25))}
.tray{
  height:124px;background:linear-gradient(#3d4142,#202425);border:7px solid #cdbca3;border-right-width:4px;
  border-radius:22px 0 0 22px;box-shadow:inset 0 0 0 2px #f4ebdc, inset 0 8px 18px rgba(255,255,255,.025);
  display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 10px
}
.tray-slot{appearance:none;position:relative;border:0;border-right:1px solid #ffffff14;background:transparent;border-radius:11px;cursor:grab;padding:0}
.tray-slot:last-child{border-right:0}.tray-slot.selected{background:#ffc55d16;outline:1px solid #e4b367}.tray-slot:active{cursor:grabbing}.tray-slot .stack{bottom:5px}
.tray-label{
  display:grid;place-items:center;background:linear-gradient(145deg,#d9c5a7,#cab08c);
  border:1px solid #c3a783;border-radius:0 17px 17px 0;color:#49392c;
  font-weight:1000;font-size:15px;letter-spacing:.035em;line-height:1.12;text-align:center
}
.tray-label small{font-size:10px;letter-spacing:.04em;margin-top:7px}
.settings{
  position:fixed;right:28px;top:24px;z-index:50;width:56px;height:56px;border-radius:12px;
  border:1px solid #aaa;background:linear-gradient(#505455,#2e3233);box-shadow:0 6px 13px #3a291e55;
  color:#ecece9;font-size:29px;cursor:pointer
}
.banner{position:fixed;left:50%;top:12%;z-index:80;transform:translate(-50%,-18px) scale(.94);opacity:0;pointer-events:none;background:linear-gradient(145deg,#40342a,#1f1c19);border:1px solid #c79344;color:#fff2d0;border-radius:18px;padding:12px 22px;box-shadow:0 14px 45px #0006;text-align:center;transition:.23s}
.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}.banner small{display:block;color:#f8c75d;font-weight:950;letter-spacing:.18em}.banner b{display:block;font-size:19px;margin-top:4px}
.overlay{position:fixed;inset:0;z-index:100;background:#211a16c9;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none!important}
.modal{width:min(420px,92vw);background:linear-gradient(145deg,#3b3028,#201c19);border:1px solid #786047;color:#f7ead8;border-radius:22px;padding:24px;box-shadow:0 24px 70px #0007}.modal h2{margin:2px 0 8px;font-size:31px}.modal p{color:#cdbda9;line-height:1.5}.result{background:#161412;border-radius:15px;padding:16px;text-align:center;margin:14px 0}.result span,.result small{display:block;color:#c7b7a3;font-size:11px;letter-spacing:.1em}.result b{display:block;font-size:44px;color:#ffd767}.modal-actions{display:grid;gap:8px}.modal button{width:100%;padding:11px;border-radius:12px;font-weight:900}.primary{border:0;background:linear-gradient(#ffd783,#eaaa4f);color:#342416}.secondary{border:1px solid #6d5846;background:transparent;color:#ead9c4}
.ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 10px 8px #0004);opacity:.97}.ghost .stack{position:relative;left:auto;bottom:auto;transform:none}.flying,.v07-fly{position:fixed;z-index:130;pointer-events:none;margin:0;will-change:transform,opacity}
.build-badge{position:fixed;left:12px;bottom:10px;z-index:4;font-size:10px;font-weight:900;letter-spacing:.08em;color:#5d432d88}
@keyframes bad{50%{transform:translateX(4px);border-color:#d95d4d}75%{transform:translateX(-3px)}}
@keyframes near{50%{transform:translateY(-1px)}}
@keyframes charge{from{transform:translateY(0)}to{transform:translateY(-1px)}}
@keyframes scoreHit{0%{transform:scale(1)}42%{transform:scale(1.065)}100%{transform:scale(1)}}
@media(max-width:1180px){
  :root{--cap:72px;--cell-h:84px;--gap:6px}
  .scene{grid-template-columns:220px minmax(560px,660px) 220px;gap:14px;padding:14px}
  .side{min-height:800px}.logo{font-size:62px}.scribble{font-size:31px;left:0;width:220px}.note{right:18px;width:160px;font-size:23px}.arscap{left:44px}.coaster{width:170px;height:170px;font-size:21px}.glass{width:88px;height:190px}.goodvibes{left:42px}.opener{left:8px;height:170px}
  .tray{height:108px}
}
@media(max-width:980px){
  :root{--cap:56px;--cell-h:66px;--gap:5px}
  body{padding:0}.scene{display:block;width:min(100vw,590px);min-height:100svh;padding:6px}.side{display:none}.game-shell{max-width:none;padding:0}.hud{gap:5px;margin-top:3px}.hud-card{height:60px}.hud-card span{font-size:9px}.hud-card b{font-size:19px}.hud-card.score b{font-size:26px}.board{padding:10px 9px 9px;border-radius:21px}.tray{height:94px}.tray-wrap{grid-template-columns:1fr 100px}.settings{top:8px;right:8px;width:42px;height:42px;font-size:23px}.build-badge{display:none}
}
@media(max-width:500px){
  :root{--cap:48px;--cell-h:58px;--gap:4px}.hud-card b{font-size:16px}.hud-card.score b{font-size:22px}.tray{height:84px}.tray-wrap{grid-template-columns:1fr 88px}.tray-label{font-size:11px}.tray-label small{font-size:8px}
}
</style>

<script>
(async()=>{
  try{
    const ars64=await fetch('assets/arscorp-cap.webp.b64?v=20260922a',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('ars '+r.status);return r.text()});
    document.documentElement.style.setProperty('--arscap',`url("data:image/webp;base64,${ars64.trim()}")`);
    document.documentElement.dataset.assets='ready';
  }catch(err){
    document.documentElement.dataset.assets='error';
    console.error('Asset load failed',err);
  }
})();
</script>
