<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d1a877">
<title>Cap Stack Sort — V2 Playtest</title>
<style>
:root{
  --cap-size:96px;
  --wood1:#e7c08e;--wood2:#d5aa76;--wood3:#c59663;
  --cream:#ead8bb;--cream2:#f5e8d3;--dark:#292d2f;--gold:#ffd142;
  --sprite:url('https://raw.githubusercontent.com/ars023ai/chip-sort-game-v.1.1/facaded6d58d6ad0c607b825c594185976a01664/assets/cap-sprite-v08.webp');
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow:hidden}
body{
  min-height:100svh;display:grid;place-items:center;padding:14px;
  font-family:Inter,Arial,Helvetica,sans-serif;color:#3b2d21;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(circle at 49% 30%,#f7deb9aa 0 18%,transparent 47%),
    repeating-linear-gradient(0deg,transparent 0 72px,#8f62351f 73px 76px,#fff3d81f 77px 79px),
    linear-gradient(110deg,var(--wood3),var(--wood1) 35%,var(--wood2) 66%,#b98755);
}
body:before,body:after{content:'';position:fixed;z-index:0;width:310px;height:220px;pointer-events:none;opacity:.88;filter:drop-shadow(0 15px 16px #0003);background:
 radial-gradient(ellipse at 20% 45%,#254a1b 0 26%,transparent 27%),
 radial-gradient(ellipse at 55% 30%,#3b6728 0 25%,transparent 26%),
 radial-gradient(ellipse at 76% 70%,#1e4017 0 27%,transparent 28%),
 radial-gradient(ellipse at 38% 78%,#527f33 0 23%,transparent 24%)}
body:before{left:-110px;top:-80px;transform:rotate(-22deg)}body:after{right:-120px;bottom:-88px;transform:rotate(158deg)}
button{font:inherit}
.scene{position:relative;z-index:2;width:min(1460px,98vw);height:min(1040px,95vh);display:grid;grid-template-columns:minmax(220px,1fr) minmax(600px,760px) minmax(240px,1fr);gap:22px;align-items:center}
.side{align-self:stretch;position:relative;display:flex;flex-direction:column;justify-content:center;gap:28px;min-width:0}
.brand-block{align-self:center;transform:rotate(-6deg);filter:drop-shadow(0 10px 8px #2d1b104f)}
.logo{font-weight:1000;line-height:.76;letter-spacing:-.07em;font-size:clamp(48px,5.4vw,82px);color:#f4f7f7;text-shadow:0 3px 0 #24649a,0 7px 0 #0e3f69,0 11px 15px #0005;position:relative}
.logo:before{content:'♛';position:absolute;left:40%;top:-.55em;color:#ffd13d;text-shadow:0 3px 0 #1d4f80;font-size:.72em;transform:rotate(5deg)}
.logo b{display:block;color:#ffd13d}.logo small{display:block;width:max-content;margin:.25em 0 0 1.18em;padding:.18em .38em;border:4px solid #214e70;border-radius:9px;background:#dce3e5;color:#24415a;font-size:.31em;letter-spacing:.02em;text-shadow:none;box-shadow:0 4px 0 #15364c}
.tag{margin:15px 0 0 8px;font-size:13px;font-weight:1000;letter-spacing:.08em;color:#3d2e22;text-shadow:0 1px #fff4}
.scribble{align-self:center;font:italic clamp(27px,2.8vw,43px)/1.15 Georgia,serif;color:#9e7449;transform:rotate(-7deg);text-align:center;opacity:.78}
.goodvibes{width:100px;height:100px;border-radius:50%;margin:auto;display:grid;place-items:center;text-align:center;line-height:1.02;color:#eee;font-weight:1000;background:radial-gradient(circle at 36% 26%,#555,#161719 57%,#050505);border:9px ridge #141414;box-shadow:0 11px 15px #51362255,inset 0 2px 4px #fff4}
.opener{position:absolute;left:6%;bottom:6%;width:84px;height:174px;border-radius:21px;background:linear-gradient(145deg,#ece9e2,#91989b);border:2px solid #757a7d;box-shadow:0 12px 17px #5137224a;transform:rotate(-13deg);display:grid;place-items:center;text-align:center;font-weight:1000;line-height:1.28;color:#62676a}.opener:before{content:'';position:absolute;top:13px;width:44px;height:28px;border:8px solid #a7aaab;border-radius:16px;background:#cfd1d0}.opener span{margin-top:35px}
.loose-cola{position:absolute;left:-4%;bottom:-1%;width:96px;height:96px;border-radius:50%;background-image:var(--sprite);background-size:500% 400%;background-position:0 0;filter:drop-shadow(0 8px 8px #40261966);transform:rotate(-9deg)}
.note{align-self:center;min-width:200px;padding:24px 28px;background:linear-gradient(135deg,#f1dfb8,#d4b786);box-shadow:0 13px 19px #60422838;transform:rotate(8deg);font:italic 25px/1.34 Georgia,serif;color:#78634a;text-align:center}
.arscap{width:104px;height:104px;border-radius:50%;margin:2px auto;position:relative;background:radial-gradient(circle at 35% 25%,#3d3d3d,#0f1011 60%,#050505);border:9px ridge #101112;box-shadow:0 11px 14px #402a2255,inset 0 2px 4px #fff3;display:grid;place-items:center;color:#e9e9e9}.arscap:before{content:'A';font:bold 58px/1 Arial,sans-serif;transform:skew(-8deg);text-shadow:0 2px 4px #000}.arscap:after{content:'ArsCorp';position:absolute;bottom:20px;font-size:12px;font-weight:900;letter-spacing:.02em}
.coaster{width:184px;height:184px;border-radius:50%;margin:auto;background:radial-gradient(#dfb785,#b37d45);border:2px solid #a97745;box-shadow:0 9px 15px #5b3b273d;display:grid;place-items:center;text-align:center;font-size:25px;line-height:1.25;font-weight:1000;color:#704a28;transform:rotate(-9deg)}
.glass{position:absolute;right:-2%;bottom:7%;width:92px;height:155px;border-radius:13px 13px 32px 32px;background:linear-gradient(90deg,#ffffff5c,#ffffff12 30%,#fff7 72%,#ffffff25),linear-gradient(#0000 0 33%,#8d4c1da0 34% 100%);border:2px solid #ffffff8b;box-shadow:0 12px 16px #53342146;transform:rotate(5deg)}
.game-shell{width:100%;max-width:760px;margin:auto;position:relative}
.hud{display:grid;grid-template-columns:1.15fr .9fr .85fr .95fr;gap:8px;margin-bottom:10px}
.hud-card{height:76px;border-radius:10px;background:linear-gradient(145deg,#444849,#292d2f);border:1px solid #8e8d88;box-shadow:0 6px 10px #52382335,inset 0 1px #ffffff35;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.hud-card span{font-size:11px;letter-spacing:.13em;color:#d8d5ce;font-weight:900}.hud-card b{font-size:28px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}.hud-card.score b{font-size:34px;color:#ffe04f}.hud-card.combo b{color:#ff951f}.score-hit{animation:scoreHit .17s cubic-bezier(.2,.8,.2,1)}
.board-shell{position:relative;padding:17px 15px 15px;border-radius:29px;background:linear-gradient(145deg,#f1dfc6,#d7c2a5 58%,#efe1ca);border:2px solid #f9ecdc;box-shadow:0 18px 28px #5a3d284d,inset 0 0 0 2px #b89d7c,inset 0 0 0 9px #e7d4ba}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,102px);gap:8px;position:relative;z-index:2}
.cell{appearance:none;position:relative;border-radius:14px;background:linear-gradient(145deg,#dccbb3,#eadbc5);border:1px solid #eadbc7;box-shadow:inset 0 2px 3px #8b74532d,0 1px 0 #fff9;overflow:visible;transition:.14s border-color,.14s box-shadow,.14s transform;min-width:0;padding:0}.cell.empty:hover,.cell.target{border-color:#daa64c;box-shadow:inset 0 2px 3px #8d765438,0 0 0 3px #f9ca70bb,0 0 20px #ffc75d66}.cell.bad{animation:bad .32s ease}.cell.pulse8{box-shadow:inset 0 2px 3px #8d765438,0 0 0 2px #f0bd596f,0 0 14px #eec46d55}.cell.pulse9{box-shadow:inset 0 2px 3px #8d765438,0 0 0 3px #f4c45b9c,0 0 24px #ffd46d8a;animation:near .9s ease-in-out infinite}.cell.charged{box-shadow:inset 0 2px 3px #8d765438,0 0 0 3px #ffe2a6d9,0 0 29px #ffc95d92;animation:charge .34s ease-in-out infinite alternate}
.stack{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:var(--cap-size);height:calc(var(--cap-size) + 54px);pointer-events:none}.cap{position:absolute;width:var(--cap-size);height:var(--cap-size);border-radius:50%;background-image:var(--sprite);background-size:500% 400%;background-repeat:no-repeat;filter:drop-shadow(0 4px 2px #2c1b1059);pointer-events:none}
.tray-wrap{margin:10px auto 0;width:94%;display:grid;grid-template-columns:1fr 125px}.tray{height:124px;background:linear-gradient(#3d4142,#202425);border:7px solid #c9bba6;border-radius:21px 0 0 21px;box-shadow:0 9px 13px #5b3a2448,inset 0 0 0 2px #f4ebdc;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px 10px}.tray-slot{appearance:none;position:relative;border:0;border-right:1px solid #ffffff14;background:transparent;border-radius:11px;cursor:grab;padding:0}.tray-slot:last-child{border-right:0}.tray-slot.selected{background:#ffc55d16;outline:2px solid #e4b367}.tray-slot:active{cursor:grabbing}.tray-slot .stack{bottom:4px}.tray-label{display:grid;place-items:center;background:#d7c3a6;border:1px solid #c4a884;border-radius:0 17px 17px 0;color:#4d3b2c;font-weight:1000;font-size:15px;letter-spacing:.03em;line-height:1.12;text-align:center}.tray-label .arrow{font-size:32px;line-height:.4}.tray-label small{font-size:10px;letter-spacing:.04em;margin-top:2px}
.settings{position:fixed;right:24px;top:22px;z-index:60;width:54px;height:54px;border-radius:12px;border:1px solid #a4a29d;background:linear-gradient(#505455,#2e3233);box-shadow:0 5px 12px #3a291e66;color:#ecece9;font-size:29px;cursor:pointer}
.banner{position:fixed;left:50%;top:12%;z-index:90;transform:translate(-50%,-18px) scale(.94);opacity:0;pointer-events:none;background:linear-gradient(145deg,#40342a,#1f1c19);border:1px solid #c79344;color:#fff2d0;border-radius:18px;padding:12px 22px;box-shadow:0 14px 45px #0006;text-align:center;transition:.23s}.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}.banner b{display:block;color:#f8c75d;font-weight:950;letter-spacing:.18em}.banner span{display:block;font-size:19px;margin-top:4px;font-weight:1000}
.overlay{position:fixed;inset:0;z-index:100;background:#211a16c9;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.overlay[hidden]{display:none!important}.modal{width:min(420px,92vw);background:linear-gradient(145deg,#3b3028,#201c19);border:1px solid #786047;color:#f7ead8;border-radius:22px;padding:24px;box-shadow:0 24px 70px #0007;text-align:center}.modal h2{margin:2px 0 8px;font-size:31px}.modal p{color:#cdbda9;line-height:1.5}.result{background:#161412;border-radius:15px;padding:16px;text-align:center;margin:14px 0}.result span,.result small{display:block;color:#c7b7a3;font-size:11px;letter-spacing:.1em}.result b{display:block;font-size:44px;color:#ffd767}.modal-actions{display:grid;gap:8px}.modal button{width:100%;padding:11px;border-radius:12px;font-weight:900;cursor:pointer}.primary{border:0;background:linear-gradient(#ffd783,#eaaa4f);color:#342416}.secondary{border:1px solid #6d5846;background:transparent;color:#ead9c4}.ghost{position:fixed;z-index:120;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 10px 8px #0004);opacity:.97}.ghost .stack{position:relative;left:auto;bottom:auto;transform:none}.flying,.v07-fly{position:fixed!important;z-index:130!important;pointer-events:none!important;margin:0!important;will-change:transform,opacity}
.build-badge{position:fixed;left:12px;bottom:10px;z-index:4;font-size:9px;font-weight:900;letter-spacing:.08em;color:#5d432d99}
@keyframes bad{50%{transform:translateX(4px);border-color:#d95d4d}75%{transform:translateX(-3px)}}@keyframes near{50%{transform:translateY(-1px)}}@keyframes charge{from{transform:translateY(0)}to{transform:translateY(-1px)}}@keyframes scoreHit{0%{transform:scale(1)}42%{transform:scale(1.065)}100%{transform:scale(1)}}
@media(max-height:940px){:root{--cap-size:78px}.scene{height:96vh}.hud-card{height:62px}.grid{grid-template-rows:repeat(6,78px)}.tray{height:96px}.coaster{width:150px;height:150px;font-size:21px}.arscap,.goodvibes{width:86px;height:86px}.scribble{font-size:30px}.opener{height:145px}}
@media(max-width:980px){:root{--cap-size:72px}body{overflow:auto}.scene{display:block;width:min(100vw,620px);height:auto;padding:8px 0}.side{display:none}.game-shell{max-width:none}.grid{grid-template-rows:repeat(6,72px)}.settings{top:8px;right:8px;width:44px;height:44px;font-size:23px}.tray{height:88px}.tray-wrap{grid-template-columns:1fr 98px}.hud-card{height:58px}.hud-card span{font-size:9px}.hud-card b{font-size:20px}.hud-card.score b{font-size:25px}.build-badge{display:none}}
</style>
</head>
<body>
<div class="scene">
  <aside class="side">
    <div class="brand-block"><div class="logo">CAP<b>STACK</b><small>SORT</small></div><div class="tag">SAME CAPS. BIGGER COMBOS.</div></div>
    <div class="scribble">Good Drinks<br>Better Combos!!</div>
    <div class="goodvibes">GOOD<br>VIBES</div>
    <div class="opener"><span>OPEN<br>MORE<br>FUN</span></div><div class="loose-cola" aria-hidden="true"></div>
  </aside>
  <main class="game-shell">
    <section class="hud" aria-label="Game status">
      <div class="hud-card score" id="score-card"><span>SCORE</span><b id="score">0</b></div>
      <div class="hud-card best"><span>BEST</span><b id="best">0</b></div>
      <div class="hud-card combo"><span>COMBO</span><b id="combo">—</b></div>
      <div class="hud-card time"><span>TIME</span><b id="time">0:00</b></div>
    </section>
    <section class="board-shell"><div class="grid" id="grid" aria-label="Game board"></div></section>
    <section class="tray-wrap"><div class="tray" id="tray"></div><div class="tray-label"><b>NEXT<br>STACKS</b><div class="arrow">⟶</div><small>DRAG OR TAP</small></div></section>
  </main>
  <aside class="side"><div class="note">Small<br>Moves.<br>Big<br>Combos!<br>♛</div><div class="arscap" aria-label="ArsCorp decorative cap"></div><div class="coaster">PLAY<br>RELAX<br>REPEAT<br>☺</div><div class="glass" aria-hidden="true"></div></aside>
</div>
<button class="settings" id="settings" aria-label="Settings">⚙</button>
<div class="build-badge">V2 • APPROVED PLAYTEST</div>
<div class="banner" id="banner"><b id="banner-title">NEW CAP UNLOCKED</b><span id="banner-text"></span></div>
<div class="overlay" id="overlay" hidden><section class="modal"><h2 id="modal-title">Settings</h2><div id="modal-body"><p>Current playtest settings.</p></div><div class="modal-actions"><button id="replay" class="primary">New game</button><button id="sound-toggle" class="secondary">Sound: On</button><button id="close-modal" class="secondary">Close</button></div></section></div>
<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
