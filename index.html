<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c99d6f"><title>Cap Stack Sort</title>
<style>
:root{--ink:#27211c;--cream:#f4ead8;--wood:#c99d6f;--dark:#26282a;--line:#c9b89c;--red:#ea584f;--blue:#4387d9;--yellow:#f3b63d;--green:#5ba773}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{color:var(--ink);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% -10%,#efd2aa 0,#d9b082 42%,#b98d60 100%);display:grid;place-items:center;padding:18px}.game{width:min(760px,100%);position:relative}.brand{font-weight:900;letter-spacing:.18em;font-size:12px;text-align:center;margin:0 0 12px;color:#4a3524}.topbar{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:stretch;margin-bottom:12px}.stat{background:rgba(255,250,239,.83);border:2px solid rgba(92,62,35,.22);border-radius:15px;box-shadow:0 5px 0 rgba(87,53,26,.16);padding:9px 12px;text-align:center}.stat b{display:block;font-size:24px;line-height:1}.stat span{font-size:10px;font-weight:900;letter-spacing:.11em;color:#765d47}.score{background:#292b2d;color:#fff;border-color:#1c1d1e}.score span{color:#d9d4ca}.tools{display:flex;justify-content:flex-end;gap:7px;align-items:center}.icon{height:36px;width:36px;border:0;border-radius:11px;background:#f5ead7;color:#413126;font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(80,49,25,.16)}.board-wrap{padding:14px;border-radius:25px;background:linear-gradient(145deg,#fff8ea,#e9d7bd);border:4px solid #b18a60;box-shadow:0 12px 0 rgba(86,50,22,.2),inset 0 1px #fff}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{position:relative;min-height:72px;border:2px solid #d2bea1;border-radius:13px;background:linear-gradient(145deg,#ead7b9,#f9ecd8);box-shadow:inset 0 2px 3px #c8b08e80,0 2px 0 #fff;cursor:pointer;overflow:visible}.cell.empty:hover,.cell.target{background:#fff8e9;outline:3px solid #e6a74f;outline-offset:1px}.cell.bad{animation:shake .35s}.stack{position:absolute;inset:0;pointer-events:none}.cap{--cap-color:#ea584f;position:absolute;width:52px;height:32px;border-radius:50% 50% 42% 42%/60% 60% 40% 40%;left:calc(50% - 26px);background:radial-gradient(ellipse at 34% 24%,#fff9 0 7%,transparent 8%),linear-gradient(145deg,#fff5,var(--cap-color) 24%,color-mix(in srgb,var(--cap-color),#000 20%) 78%);border:2px solid #ffffffa0;box-shadow:0 3px 1px #0003, inset 0 -4px 5px #0003}.cap:after{content:attr(data-label);position:absolute;inset:7px 2px auto;font-size:7px;line-height:1;font-weight:900;text-align:center;color:#fff;text-shadow:0 1px 2px #0008;white-space:nowrap}.cap.flying,.cap.v07-fly{position:fixed;z-index:20;pointer-events:none}.charged{box-shadow:0 0 0 3px #f3b63d,0 0 18px #f3b63d}.pulse9{animation:pulse 1s infinite}.pulse8{box-shadow:0 0 0 2px #9fcb96}.tray-label{margin:17px 0 8px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.18em;color:#59402e}.tray{background:#292b2d;border-radius:18px;padding:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;box-shadow:0 7px 0 #161718}.tray-slot{height:67px;position:relative;overflow:visible;border:2px solid #555a5d;border-radius:12px;background:linear-gradient(145deg,#404548,#252729);cursor:grab}.tray-slot.selected{outline:3px solid #f3b63d;outline-offset:2px}.ghost{position:fixed;z-index:30;width:66px;height:66px;pointer-events:none;transform:translate(-50%,-50%)}.ghost .stack{position:relative;height:100%}.banner{position:fixed;top:20px;left:50%;transform:translate(-50%,-140%);z-index:40;background:#282a2c;color:#fff;padding:10px 20px;border-radius:12px;text-align:center;transition:transform .28s;box-shadow:0 7px 20px #0004}.banner.show{transform:translate(-50%,0)}.banner b{display:block;font-size:11px;letter-spacing:.16em}.banner span{font-weight:900;color:#f2bd56}.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#1a1714aa;padding:20px}.modal{width:min(360px,100%);background:#fff4e1;border-radius:22px;padding:22px;text-align:center;box-shadow:0 16px 40px #0007}.modal h2{margin:0 0 10px}.result{padding:12px;border-radius:14px;background:#292b2d;color:#fff}.result span{font-size:10px;font-weight:900;letter-spacing:.13em}.result b{display:block;font-size:38px}.result small{color:#d7d0c6}.modal button{border:0;border-radius:11px;padding:11px 16px;margin:7px 3px;font-weight:900;cursor:pointer;background:#e6a74f;color:#2b2118}.modal button.secondary{background:#ddd0bb}.sound{display:none}.score-hit{animation:score .17s 2}@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}@keyframes pulse{50%{box-shadow:0 0 0 3px #e6a74f}}@keyframes score{50%{transform:scale(1.08)}}@media(max-width:520px){body{padding:10px}.cell{min-height:60px}.cap{transform:scale(.86);transform-origin:center bottom}.topbar{gap:6px}.stat{padding:7px 4px}.stat b{font-size:20px}.tools{gap:3px}.icon{width:32px;height:32px}}
</style></head><body><main class="game"><div class="brand">ARSCORP PRESENTS</div><header class="topbar"><div class="stat"><span>BEST</span><b id="best">0</b></div><div class="stat score" id="score-card"><span>SCORE</span><b id="score">0</b></div><div class="stat"><span>TIME</span><b id="time">0:00</b></div></header><div class="tools"><div class="stat" style="flex:1"><span>COMBO</span><b id="combo">—</b></div><button class="icon" id="settings" aria-label="Settings">⚙</button></div><section class="board-wrap"><div class="grid" id="grid" aria-label="Game board"></div></section><div class="tray-label">NEXT STACKS</div><section class="tray" id="tray"></section></main><div class="banner" id="banner"><b id="banner-title"></b><span id="banner-text"></span></div><div class="overlay" id="overlay" hidden><section class="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><button id="replay">New game</button><button id="sound-toggle" class="secondary">Sound: On</button><button id="close-modal" class="secondary">Close</button></section></div><script src="rules.js"></script><script src="game.js"></script></body></html>
